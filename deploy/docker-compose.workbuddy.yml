# WorkBuddy-aligned Octop stack (self-hosted 7×24)
#
# Default (lightweight, always-on):
#   docker compose -f deploy/docker-compose.workbuddy.yml up -d
#   → tick (cron) + wb-console (:8010)
#
# Full Octop API:
#   docker compose -f deploy/docker-compose.workbuddy.yml --profile full up -d
#
# Optional:
#   --profile casdoor   Casdoor SSO
#   --profile milvus    Milvus vector DB
#
# Env: copy deploy/.env.workbuddy.example → deploy/.env.workbuddy (do not commit secrets)

services:
  tick:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
      - octop_data:/var/lib/octop
    environment:
      OCTOP_HOME: /var/lib/octop
      PYTHONPATH: /app
    entrypoint:
      - bash
      - -lc
      - |
        while true; do
          python -S -m octop.contrib.workbuddy.routine.cron tick || true
          sleep 60
        done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-S", "-c", "print('ok')"]
      interval: 60s
      timeout: 5s
      retries: 3

  wb-console:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      PYTHONPATH: /app
      WB_ALLOW_OUTBOUND: ${WB_ALLOW_OUTBOUND:-0}
    command:
      - python
      - -S
      - -m
      - octop.contrib.workbuddy.console_server
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/status', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  octop:
    profiles: ["full"]
    image: python:3.12-slim
    working_dir: /app/octop
    volumes:
      - ../:/app
      - octop_data:/var/lib/octop
    environment:
      OCTOP_HOME: /var/lib/octop
      PYTHONPATH: /app/octop/src:/app
      WB_ALLOW_OUTBOUND: ${WB_ALLOW_OUTBOUND:-0}
      WB_LLM_BASE_URL: ${WB_LLM_BASE_URL:-}
      WB_LLM_MODEL: ${WB_LLM_MODEL:-}
      OCTOP_CASDOOR_ENDPOINT: ${OCTOP_CASDOOR_ENDPOINT:-}
      OCTOP_MILVUS_URI: ${OCTOP_MILVUS_URI:-}
    command:
      - bash
      - -lc
      - |
        pip install -q -e . &&
        python -m octop.cli run --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  casdoor:
    profiles: ["casdoor"]
    image: casbin/casdoor:latest
    ports:
      - "8001:8000"
    restart: unless-stopped

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

volumes:
  octop_data:
  milvus_data:
