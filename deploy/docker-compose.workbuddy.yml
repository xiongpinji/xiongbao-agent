# WorkBuddy multi-tenant production deployment
#
# Lightweight (dev / single-user):
#   docker compose -f deploy/docker-compose.workbuddy.yml up -d
#
# Full Octop API:
#   docker compose -f deploy/docker-compose.workbuddy.yml --profile full up -d
#
# Production multi-tenant (Caddy TLS, auth on, no public 8010):
#   docker compose -f deploy/docker-compose.workbuddy.yml --profile prod up -d
#
# Optional:
#   --profile casdoor   Casdoor SSO
#   --profile milvus    Milvus vector DB
#
# Env: copy deploy/.env.workbuddy.example → deploy/.env.workbuddy

services:
  tick:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
      - ../artifacts:/app/artifacts
    environment:
      OCTOP_HOME: /var/lib/octop
      PYTHONPATH: /app
      WB_MULTI_TENANT: ${WB_MULTI_TENANT:-0}
      WB_ARTIFACTS_ROOT: /app/artifacts
    entrypoint:
      - bash
      - -lc
      - |
        while true; do
          python -S -m octop.contrib.workbuddy.routine.cron tick || true
          sleep 60
        done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-S", "-c", "print('ok')"]
      interval: 60s
      timeout: 5s
      retries: 3

  wb-console:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
      - ../artifacts:/app/artifacts
    environment:
      PYTHONPATH: /app
      WB_ALLOW_OUTBOUND: ${WB_ALLOW_OUTBOUND:-0}
      WB_MULTI_TENANT: ${WB_MULTI_TENANT:-0}
      WB_CONSOLE_AUTH: ${WB_CONSOLE_AUTH:-0}
      WB_CONSOLE_SECRET: ${WB_CONSOLE_SECRET:-wb-dev-secret-change-me}
      WB_ARTIFACTS_ROOT: /app/artifacts
      WB_TENANT_REGISTRY: /app/artifacts/tenants/_registry.json
    command:
      - python
      - -S
      - -m
      - octop.contrib.workbuddy.console_server
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    # Dev maps 8010; production profile uses Caddy only (see wb-console-prod + caddy)
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Production: console without host port publish
  wb-console-prod:
    profiles: ["prod"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
      - ../artifacts:/app/artifacts
    environment:
      PYTHONPATH: /app
      WB_ALLOW_OUTBOUND: ${WB_ALLOW_OUTBOUND:-0}
      WB_MULTI_TENANT: "1"
      WB_CONSOLE_AUTH: "1"
      WB_CONSOLE_SECRET: ${WB_CONSOLE_SECRET:?set WB_CONSOLE_SECRET}
      WB_ARTIFACTS_ROOT: /app/artifacts
      WB_TENANT_REGISTRY: /app/artifacts/tenants/_registry.json
      WB_LLM_BASE_URL: ${WB_LLM_BASE_URL:-}
      WB_LLM_MODEL: ${WB_LLM_MODEL:-}
      OCTOP_CASDOOR_ENDPOINT: ${OCTOP_CASDOOR_ENDPOINT:-}
      OCTOP_CASDOOR_CLIENT_ID: ${OCTOP_CASDOOR_CLIENT_ID:-}
      OCTOP_CASDOOR_CLIENT_SECRET: ${OCTOP_CASDOOR_CLIENT_SECRET:-}
      OCTOP_MILVUS_URI: ${OCTOP_MILVUS_URI:-}
    command:
      - python
      - -S
      - -m
      - octop.contrib.workbuddy.console_server
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    ports:
      # Local实测明文入口（生产对外仍走 Caddy 443；本机调试可直接 http://127.0.0.1:8010）
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-S",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    profiles: ["prod"]
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wb-console-prod
    restart: unless-stopped

  octop:
    profiles: ["full", "prod"]
    image: python:3.12-slim
    working_dir: /app/octop
    volumes:
      - ../:/app
      - octop_data:/var/lib/octop
      - ../artifacts:/app/artifacts
    environment:
      OCTOP_HOME: /var/lib/octop
      PYTHONPATH: /app/octop/src:/app
      WB_ALLOW_OUTBOUND: ${WB_ALLOW_OUTBOUND:-0}
      WB_LLM_BASE_URL: ${WB_LLM_BASE_URL:-}
      WB_LLM_MODEL: ${WB_LLM_MODEL:-}
      WB_MULTI_TENANT: ${WB_MULTI_TENANT:-1}
      WB_ARTIFACTS_ROOT: /app/artifacts
      OCTOP_CASDOOR_ENDPOINT: ${OCTOP_CASDOOR_ENDPOINT:-}
      OCTOP_MILVUS_URI: ${OCTOP_MILVUS_URI:-}
    command:
      - bash
      - -lc
      - |
        pip install -q -e . &&
        python -m octop.cli run --host 0.0.0.0 --port 8000
    # prod: only expose internally; caddy can reverse-proxy if needed
    ports:
      - "8000:8000"
    restart: unless-stopped

  casdoor-db:
    profiles: ["casdoor"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: casdoor
      MYSQL_DATABASE: casdoor
    volumes:
      - casdoor_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pcasdoor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  casdoor:
    profiles: ["casdoor"]
    image: casbin/casdoor:v1.770.0
    depends_on:
      casdoor-db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./casdoor/app.conf:/conf/app.conf:ro
    restart: unless-stopped

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

volumes:
  octop_data:
  milvus_data:
  caddy_data:
  caddy_config:
  casdoor_db:
