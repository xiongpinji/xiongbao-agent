# Local OpenAI-compatible backend (Ollama / vLLM / OpenAI proxy).
# Credentials via env — see vendor/workbuddy-bench/.env.example.
model:
  name: qwen2.5:3b
  protocols: [openai]
  backend_url_env: WB_LLM_BASE_URL
  backend_key_env: WB_LLM_API_KEY
  params:
    max_output_tokens: 4096
    temperature: 0.0
