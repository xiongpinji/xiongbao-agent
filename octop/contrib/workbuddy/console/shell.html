<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知远 · WorkBuddy</title>
  <link rel="stylesheet" href="/console/tokens.css" />
  <link rel="stylesheet" href="/console/shell.css" />
  <script src="/console/shell_parity.js" defer></script>
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">知远<span>WorkBuddy</span></div>
    <span class="chip muted" id="sessionChip">未登录</span>
    <span class="chip" id="projectChip" title="当前项目空间">项目 · —</span>
    <span class="chip" id="modeChip" title="当前模式">创作</span>
    <span class="chip muted" id="modelChip" title="当前模型">模型 · —</span>
    <span class="chip muted" id="entChip" title="企业服务">企业服务 · —</span>
    <div class="grow"></div>
    <nav class="topbar-nav" aria-label="主导航">
      <button type="button" class="linkish hide-sm" id="btnProjects">项目空间</button>
      <button type="button" class="linkish hide-sm" id="btnSkills">技能</button>
      <a class="hide-sm" href="/ops.html" id="btnOps">设置</a>
      <div class="more-wrap">
        <button type="button" class="linkish" id="btnMore" aria-haspopup="true" aria-expanded="false">更多</button>
        <div class="more-menu" id="moreMenu" role="menu">
          <button type="button" id="btnLayout">布局档位</button>
          <button type="button" id="btnHarbor">Harbor 演练</button>
          <button type="button" id="btnScore">评分</button>
          <a href="/ops.html">运维控制台</a>
          <button type="button" id="btnLogout">退出登录</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="mobile-tabs" id="mobileTabs" role="tablist" aria-label="窄屏分区">
    <button type="button" data-pane="left" role="tab">任务</button>
    <button type="button" data-pane="center" class="active" role="tab">对话</button>
    <button type="button" data-pane="right" role="tab">结果</button>
  </div>

  <div class="app layout-standard" id="app" role="presentation">
    <nav class="col left" aria-label="任务列表">
      <div class="col-hd">
        <h2>任务</h2>
        <button type="button" class="btn" id="btnNew">新建</button>
      </div>
      <div class="col-hd" style="border-bottom:0;padding-top:0;gap:0.4rem">
        <select id="projectSelect" aria-label="项目空间" style="flex:1;min-width:0">
          <option value="">全部项目</option>
        </select>
        <button type="button" class="btn ghost" id="btnNewProject" title="新建项目空间">+</button>
      </div>
      <div class="col-hd" style="border-bottom:0;padding-top:0">
        <input class="search" id="search" type="search" placeholder="搜索任务…" aria-label="搜索任务" />
      </div>
      <div class="task-list" id="taskList"></div>
    </nav>

    <main class="col center" aria-label="对话">
      <div class="col-hd">
        <h2 id="taskTitle">选择或新建任务</h2>
        <select id="modeSelect" aria-label="任务模式">
          <option value="ask">询问</option>
          <option value="plan">规划</option>
          <option value="craft" selected>创作</option>
        </select>
        <button type="button" class="btn ghost" id="btnPin" title="置顶">★</button>
        <button type="button" class="btn ghost" id="btnRename" title="改名">改名</button>
        <button type="button" class="btn ghost" id="btnArchive">归档</button>
        <button type="button" class="btn danger" id="btnDelete" title="删除">删除</button>
      </div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="empty">
          <div class="empty-art" aria-hidden="true"></div>
          选择左侧任务，或新建第一个任务开始
          <div class="cta"><button type="button" class="btn" id="btnEmptyNew">新建第一个任务</button></div>
        </div>
      </div>
      <div class="composer">
        <textarea id="composer" placeholder="描述你要完成的事…（Enter 发送，Shift+Enter 换行）" aria-label="消息输入"></textarea>
        <div class="composer-row">
          <label class="switch" title="开启后只规划不执行">
            <input type="checkbox" id="dryRun" />
            <span>仅演练</span>
          </label>
          <label class="btn ghost" style="cursor:pointer;margin:0">
            附件
            <input type="file" id="fileInput" hidden />
          </label>
          <span class="hint" id="uploadHint" style="font-size:0.75rem;color:var(--muted)"></span>
          <div class="grow"></div>
          <button type="button" class="btn" id="btnSend">发送</button>
        </div>
      </div>
    </main>

    <aside class="col right" aria-label="结果">
      <div class="col-hd"><h2>结果</h2></div>
      <div class="tabs" id="resultTabs" role="tablist">
        <button type="button" data-pane="artifacts" class="active" role="tab">产物</button>
        <button type="button" data-pane="files" role="tab">文件</button>
        <button type="button" data-pane="changes" role="tab">变更</button>
        <button type="button" data-pane="preview" role="tab">预览</button>
      </div>
      <div class="pane active" id="pane-artifacts" role="tabpanel"></div>
      <div class="pane" id="pane-files" role="tabpanel"></div>
      <div class="pane" id="pane-changes" role="tabpanel"></div>
      <div class="pane" id="pane-preview" role="tabpanel">
        <div id="previewHost"><div class="empty"><div class="empty-art"></div>选择文件查看预览</div></div>
      </div>
    </aside>
  </div>

  <div class="login-mask show" id="loginMask" role="dialog" aria-modal="true" aria-labelledby="loginBrandTitle">
    <div class="login-shell">
      <div class="login-brand">
        <h1 id="loginBrandTitle">知远 WorkBuddy</h1>
        <p>企业本地工作台 · 登录后管理任务与产物</p>
      </div>
      <div class="login-card">
        <div class="login-tabs" role="tablist">
          <button type="button" class="active" data-login="key" role="tab">API Key</button>
          <button type="button" data-login="sso" role="tab">Casdoor 换发</button>
        </div>
        <form class="login-pane active" id="loginFormKey">
          <p class="hint">使用租户 ID 与管理员 API Key（多租户隔离）</p>
          <label>租户 ID<input name="tid" required placeholder="acme_corp" autocomplete="username" /></label>
          <label>用户 ID<input name="uid" value="admin" required /></label>
          <label>API Key<input name="key" type="password" required autocomplete="current-password" /></label>
          <button type="submit" class="btn">进入工作台</button>
        </form>
        <form class="login-pane" id="loginFormSso">
          <p class="hint">粘贴 Casdoor access_token，或由运维配置 password-grant 后换发。换发成功后签发本机 JWT。</p>
          <label>Casdoor Token<textarea name="casdoor" rows="4" required placeholder="eyJhbGciOi…" style="resize:vertical"></textarea></label>
          <button type="submit" class="btn">换发并登录</button>
        </form>
        <p id="loginErr" style="margin:0;color:var(--danger);font-size:0.8rem"></p>
      </div>
    </div>
  </div>

  <aside class="skills-drawer" id="skillsDrawer" aria-label="技能市场">
    <div class="col-hd">
      <h2>技能市场</h2>
      <button type="button" class="btn ghost" id="btnCloseSkills">关闭</button>
    </div>
    <div class="skills-list" id="skillsList"></div>
  </aside>

  <aside class="skills-drawer" id="projectDrawer" aria-label="项目空间">
    <div class="col-hd">
      <h2 id="projectDrawerTitle">项目空间</h2>
      <button type="button" class="btn ghost" id="btnCloseProject">关闭</button>
    </div>
    <div class="skills-list" id="projectPanel">
      <p class="hint" style="color:var(--muted);font-size:0.85rem;padding:0 0.25rem">选择或新建项目后，可将市场技能存入本空间；执行任务时自动加载。</p>
      <div id="projectSkillList"></div>
    </div>
  </aside>

  <div class="task-ctx-menu" id="taskCtxMenu" role="menu">
    <button type="button" data-act="rename">改名</button>
    <button type="button" data-act="pin">置顶/取消</button>
    <button type="button" data-act="archive">归档</button>
    <button type="button" class="danger" data-act="delete">删除</button>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script>
    const TOKEN_KEY = "wb_shell_jwt";
    const LAYOUT_KEY = "wb_shell_layout";
    const MODE_LABEL = { ask: "询问", plan: "规划", craft: "创作" };
    const ROLE_LABEL = { user: "你", assistant: "助手", system: "系统" };
    const STATUS_LABEL = {
      pending: "待开始", running: "进行中", waiting: "等待中",
      completed: "已完成", failed: "失败", cancelled: "已取消"
    };
    const PROJECT_KEY = "wb_shell_project";
    let state = {
      tasks: [], current: null, authRequired: true,
      sending: false, pollTimer: null, currentStatus: "",
      ctxTaskId: null, liveConfirmShown: false,
      projects: [], projectId: localStorage.getItem(PROJECT_KEY) || ""
    };
    const layouts = ["layout-narrow", "layout-standard", "layout-wide"];

    function token() { return localStorage.getItem(TOKEN_KEY) || ""; }
    function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }
    function headers(extra = {}) {
      const h = Object.assign({ "Content-Type": "application/json" }, extra);
      const t = token();
      if (t) h.Authorization = "Bearer " + t;
      return h;
    }
    function toast(msg, kind) {
      const host = document.getElementById("toastHost");
      const el = document.createElement("div");
      el.className = "toast" + (kind ? " " + kind : "");
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }
    async function api(path, opts = {}) {
      let r;
      try {
        r = await fetch(path, Object.assign({}, opts, { headers: headers(opts.headers || {}) }));
      } catch (e) {
        toast("网络错误：" + (e.message || "无法连接"), "error");
        throw e;
      }
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(data.error || ("HTTP " + r.status));
        err.status = r.status; err.data = data;
        if (r.status === 401) toast("登录已失效，请重新登录", "error");
        else toast(err.message, "error");
        throw err;
      }
      return data;
    }
    window.wbApi = api;
    window.wbToast = toast;
    window.wbState = state;
    window.wbRefreshTask = async (id) => {
      if (!id) return;
      await openTask(id);
      await refreshWorkspace(id);
      await refreshTasks();
    };
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function humanizeContent(raw) {
      let s = String(raw || "");
      s = s.replace(/^\[dry-run\]\s*planned\s+(\d+)\s+steps[^\n]*/i,
        (_, n) => `已完成演练：规划了 ${n} 步，未实际执行。`);
      s = s.replace(/^goal\s+run\s+\S+\s*→\s*accepted/i, "执行完成。可在右侧查看产物与预览。");
      s = s.replace(/^goal\s+run\s+\S+\s*→\s*(\S+)/i, (_, st) => `执行结束（状态：${st}）`);
      s = s.replace(/^\[upload\]\s*/i, "已上传附件：");
      return s;
    }
    function formatRelTime(iso) {
      if (!iso) return "";
      const t = Date.parse(iso);
      if (!t) return "";
      const sec = Math.round((Date.now() - t) / 1000);
      if (sec < 60) return "刚刚";
      if (sec < 3600) return Math.floor(sec / 60) + " 分钟前";
      if (sec < 86400) return Math.floor(sec / 3600) + " 小时前";
      if (sec < 604800) return Math.floor(sec / 86400) + " 天前";
      try { return new Date(t).toLocaleDateString("zh-CN"); } catch { return ""; }
    }
    function formatTs(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch { return ""; }
    }
    function showLogin(show) {
      document.getElementById("loginMask").classList.toggle("show", !!show);
    }
    function applyLayout(name) {
      const app = document.getElementById("app");
      layouts.forEach(c => app.classList.remove(c));
      const cls = layouts.includes(name) ? name : "layout-standard";
      app.classList.add(cls);
      localStorage.setItem(LAYOUT_KEY, cls);
    }
    applyLayout(localStorage.getItem(LAYOUT_KEY) || "layout-standard");

    /* —— more menu —— */
    const moreBtn = document.getElementById("btnMore");
    const moreMenu = document.getElementById("moreMenu");
    moreBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = !moreMenu.classList.contains("open");
      moreMenu.classList.toggle("open", open);
      moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", () => {
      moreMenu.classList.remove("open");
      document.getElementById("taskCtxMenu").classList.remove("open");
    });
    document.getElementById("btnLayout").addEventListener("click", () => {
      const app = document.getElementById("app");
      const cur = layouts.find(c => app.classList.contains(c)) || "layout-standard";
      const next = layouts[(layouts.indexOf(cur) + 1) % layouts.length];
      applyLayout(next);
      toast("布局：" + ({ "layout-narrow": "窄", "layout-standard": "标准", "layout-wide": "宽" }[next] || next));
    });

    /* —— mobile panes —— */
    document.getElementById("mobileTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-pane]");
      if (!btn) return;
      const app = document.getElementById("app");
      app.classList.remove("show-left", "show-right");
      document.querySelectorAll("#mobileTabs button").forEach(b => b.classList.toggle("active", b === btn));
      if (btn.dataset.pane === "left") app.classList.add("show-left");
      if (btn.dataset.pane === "right") app.classList.add("show-right");
    });

    /* —— login tabs —— */
    document.querySelectorAll(".login-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".login-tabs button").forEach(b => b.classList.toggle("active", b === btn));
        document.getElementById("loginFormKey").classList.toggle("active", btn.dataset.login === "key");
        document.getElementById("loginFormSso").classList.toggle("active", btn.dataset.login === "sso");
        document.getElementById("loginErr").textContent = "";
      });
    });

    async function ensureAuth() {
      const health = await api("/api/health");
      state.authRequired = !!health.auth_required;
      const model = health.model || "未配置";
      document.getElementById("modelChip").textContent = "模型 · " + model;
      if (!state.authRequired) { showLogin(false); return true; }
      if (!token()) { showLogin(true); return false; }
      try {
        const ten = await api("/api/tenant");
        document.getElementById("sessionChip").textContent = (ten.name || ten.tenant_id) + " / " + (ten.role || "admin");
        showLogin(false);
        return true;
      } catch {
        setToken("");
        showLogin(true);
        return false;
      }
    }

    document.getElementById("loginFormKey").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            tenant_id: fd.get("tid"),
            user_id: fd.get("uid"),
            api_key: fd.get("key"),
          }),
        });
        setToken(data.token);
        document.getElementById("loginErr").textContent = "";
        await boot();
      } catch (err) {
        document.getElementById("loginErr").textContent = err.message;
      }
    });
    document.getElementById("loginFormSso").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ casdoor_token: String(fd.get("casdoor") || "").trim() }),
        });
        setToken(data.token);
        document.getElementById("loginErr").textContent = "";
        await boot();
      } catch (err) {
        document.getElementById("loginErr").textContent = err.message;
      }
    });
    document.getElementById("btnLogout").addEventListener("click", () => {
      setToken(""); location.reload();
    });

    function statusBadge(status) {
      const st = status || "pending";
      return `<span class="status-badge ${escapeHtml(st)}">${STATUS_LABEL[st] || st}</span>`;
    }

    async function refreshProjects() {
      const data = await api("/api/projects");
      state.projects = data.projects || [];
      const sel = document.getElementById("projectSelect");
      const cur = state.projectId;
      sel.innerHTML = '<option value="">全部项目</option>' + state.projects.map(p =>
        `<option value="${escapeHtml(p.project_id)}">${escapeHtml(p.name || p.project_id)}（${p.skill_count || 0} 技能）</option>`
      ).join("");
      if (cur && state.projects.some(p => p.project_id === cur)) sel.value = cur;
      else if (cur && !state.projects.some(p => p.project_id === cur)) {
        state.projectId = "";
        localStorage.removeItem(PROJECT_KEY);
        sel.value = "";
      }
      updateProjectChip();
    }
    function updateProjectChip() {
      const chip = document.getElementById("projectChip");
      if (!state.projectId) {
        chip.textContent = "项目 · 未选";
        chip.className = "chip muted";
        return;
      }
      const p = state.projects.find(x => x.project_id === state.projectId);
      const n = p ? (p.skill_count || 0) : 0;
      chip.textContent = "项目 · " + (p ? (p.name || p.project_id) : state.projectId) + " · " + n + "技能";
      chip.className = "chip";
    }
    function setProjectId(id) {
      state.projectId = id || "";
      if (state.projectId) localStorage.setItem(PROJECT_KEY, state.projectId);
      else localStorage.removeItem(PROJECT_KEY);
      document.getElementById("projectSelect").value = state.projectId;
      updateProjectChip();
    }
    document.getElementById("projectSelect").addEventListener("change", async (e) => {
      setProjectId(e.target.value);
      await refreshTasks();
    });
    document.getElementById("btnNewProject").addEventListener("click", async () => {
      const id = prompt("项目 ID（英文/数字/-_）", "my_project");
      if (!id) return;
      const name = prompt("项目显示名", id) || id;
      try {
        const data = await api("/api/projects", {
          method: "POST",
          body: JSON.stringify({ project_id: id.trim(), name: name.trim() }),
        });
        await refreshProjects();
        setProjectId(data.project.project_id);
        toast("项目已创建", "ok");
        openProjectDrawer();
      } catch (err) { /* toast via api */ }
    });

    async function openProjectDrawer() {
      document.getElementById("projectDrawer").classList.add("open");
      document.getElementById("skillsDrawer").classList.remove("open");
      const pd = document.getElementById("parityDrawer");
      if (pd) pd.classList.remove("open");
      const title = document.getElementById("projectDrawerTitle");
      const box = document.getElementById("projectSkillList");
      if (!state.projectId) {
        title.textContent = "项目空间";
        box.innerHTML = '<div class="empty">请先在左侧选择或新建项目</div>';
        return;
      }
      const data = await api("/api/projects/" + encodeURIComponent(state.projectId));
      const p = data.project;
      title.textContent = (p.name || p.project_id) + " · 技能";
      const skills = p.skills || [];
      const members = p.members || [];
      box.innerHTML = `
        <p style="color:var(--muted);font-size:0.8rem;margin:0 0 0.75rem">执行归属本项目的任务时，将自动加载下列技能。</p>
        ${skills.length ? skills.map(s => `
          <div class="skill-row">
            <h3>${escapeHtml(s.name || s.id)}</h3>
            <p>${escapeHtml(s.description || "")}</p>
          </div>`).join("") : '<div class="empty">暂无项目技能<br/><button type="button" class="btn" id="btnOpenMarketFromProject" style="margin-top:0.75rem">从技能市场存入</button></div>'}
        <div style="margin-top:1rem">
          <button type="button" class="btn ghost" id="btnDepositMore">从技能市场存入…</button>
        </div>
        <h3 style="font-size:0.9rem;margin:1.25rem 0 0.4rem">成员与角色</h3>
        <p style="color:var(--muted);font-size:0.75rem;margin:0 0 0.5rem">owner 可邀请；editor 可存技能/改记忆；viewer 只读。</p>
        <div class="members-row" id="membersRow">
          ${members.length ? members.map(m => `
            <span class="member-chip" title="${escapeHtml(m.role)}">${escapeHtml(m.user_id)} · ${escapeHtml(m.role)}</span>
          `).join("") : '<span class="member-chip">（开放 / 未设成员）</span>'}
        </div>
        <div class="composer-row" style="margin-top:0.6rem;gap:0.35rem;flex-wrap:wrap">
          <input id="memberUid" placeholder="user_id" style="flex:1;min-width:6rem"/>
          <select id="memberRole">
            <option value="editor">editor</option>
            <option value="viewer">viewer</option>
            <option value="owner">owner</option>
          </select>
          <button type="button" class="btn" id="btnAddMember">添加</button>
        </div>`;
      const openM = () => { document.getElementById("projectDrawer").classList.remove("open"); document.getElementById("btnSkills").click(); };
      const a = document.getElementById("btnOpenMarketFromProject");
      const b = document.getElementById("btnDepositMore");
      if (a) a.addEventListener("click", openM);
      if (b) b.addEventListener("click", openM);
      const addBtn = document.getElementById("btnAddMember");
      if (addBtn) {
        addBtn.addEventListener("click", async () => {
          const user_id = document.getElementById("memberUid").value.trim();
          const role = document.getElementById("memberRole").value;
          if (!user_id) return;
          await api("/api/projects/" + encodeURIComponent(state.projectId) + "/members", {
            method: "POST",
            body: JSON.stringify({ user_id, role, action: "upsert" }),
          });
          toast("成员已更新", "ok");
          openProjectDrawer();
        });
      }
    }
    document.getElementById("btnProjects").addEventListener("click", openProjectDrawer);
    document.getElementById("btnCloseProject").addEventListener("click", () => {
      document.getElementById("projectDrawer").classList.remove("open");
    });
    document.getElementById("projectChip").addEventListener("click", openProjectDrawer);

    async function refreshTasks() {
      const q = document.getElementById("search").value.trim();
      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (state.projectId) params.set("project_id", state.projectId);
      const qs = params.toString();
      const data = await api("/api/tasks" + (qs ? ("?" + qs) : ""));
      state.tasks = data.tasks || [];
      const box = document.getElementById("taskList");
      if (!state.tasks.length) {
        box.innerHTML = `<div class="empty"><div class="empty-art"></div>暂无任务
          <div class="cta"><button type="button" class="btn" id="btnEmptyNewSide">新建第一个任务</button></div></div>`;
        const b = document.getElementById("btnEmptyNewSide");
        if (b) b.addEventListener("click", createTaskPrompt);
        return;
      }
      box.innerHTML = state.tasks.map(t => `
        <div class="task-item ${state.current === t.task_id ? "active" : ""}" data-id="${escapeHtml(t.task_id)}">
          <button type="button" class="menu-btn" data-menu="${escapeHtml(t.task_id)}" title="更多" aria-label="任务菜单">⋯</button>
          <div class="t">${t.pinned ? '<span class="pin">★ </span>' : ""}${escapeHtml(t.title)}</div>
          <div class="m">
            ${statusBadge(t.status)}
            <span class="mode-dot ${escapeHtml(t.mode || "craft")}" title="${MODE_LABEL[t.mode] || t.mode}"></span>
            <span>${MODE_LABEL[t.mode] || t.mode}</span>
            ${t.project_id ? `<span title="项目">${escapeHtml(t.project_id)}</span>` : ""}
            <span>${formatRelTime(t.updated_at)}</span>
          </div>
        </div>`).join("");
    }

    document.getElementById("taskList").addEventListener("click", (e) => {
      const menuBtn = e.target.closest("[data-menu]");
      if (menuBtn) {
        e.stopPropagation();
        openTaskMenu(menuBtn.dataset.menu, e.clientX, e.clientY);
        return;
      }
      const item = e.target.closest(".task-item");
      if (!item) return;
      openTask(item.dataset.id);
    });
    document.getElementById("search").addEventListener("input", () => {
      clearTimeout(window.__sq);
      window.__sq = setTimeout(refreshTasks, 200);
    });

    function openTaskMenu(taskId, x, y) {
      state.ctxTaskId = taskId;
      const menu = document.getElementById("taskCtxMenu");
      menu.classList.add("open");
      menu.style.left = Math.min(x, window.innerWidth - 160) + "px";
      menu.style.top = Math.min(y, window.innerHeight - 160) + "px";
    }
    document.getElementById("taskCtxMenu").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn || !state.ctxTaskId) return;
      e.stopPropagation();
      const id = state.ctxTaskId;
      document.getElementById("taskCtxMenu").classList.remove("open");
      if (btn.dataset.act === "rename") await renameTask(id);
      else if (btn.dataset.act === "pin") {
        const cur = state.tasks.find(t => t.task_id === id);
        await api("/api/tasks/" + encodeURIComponent(id) + "/patch", {
          method: "POST", body: JSON.stringify({ pinned: !(cur && cur.pinned) }),
        });
        await refreshTasks();
      } else if (btn.dataset.act === "archive") {
        await api("/api/tasks/" + encodeURIComponent(id) + "/patch", {
          method: "POST", body: JSON.stringify({ archived: true }),
        });
        if (state.current === id) clearCurrent("任务已归档");
        await refreshTasks();
      } else if (btn.dataset.act === "delete") {
        await deleteTask(id);
      }
    });

    async function renameTask(id) {
      const cur = state.tasks.find(t => t.task_id === id);
      const title = prompt("任务名称", (cur && cur.title) || "");
      if (!title) return;
      await api("/api/tasks/" + encodeURIComponent(id) + "/patch", {
        method: "POST", body: JSON.stringify({ title }),
      });
      if (state.current === id) document.getElementById("taskTitle").textContent = title;
      await refreshTasks();
      toast("已改名", "ok");
    }
    async function deleteTask(id) {
      if (!confirm("确定删除该任务？此操作不可恢复。")) return;
      await api("/api/tasks/" + encodeURIComponent(id) + "/delete", { method: "POST", body: "{}" });
      if (state.current === id) clearCurrent("任务已删除");
      await refreshTasks();
      toast("已删除", "ok");
    }
    function clearCurrent(msg) {
      state.current = null;
      state.currentStatus = "";
      stopPoll();
      document.getElementById("taskTitle").textContent = "选择或新建任务";
      document.getElementById("messages").innerHTML = `<div class="empty"><div class="empty-art"></div>${escapeHtml(msg || "选择任务")}</div>`;
      ["pane-artifacts", "pane-files", "pane-changes"].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="empty"><div class="empty-art"></div>暂无内容</div>';
      });
    }

    async function openTask(id) {
      state.current = id;
      const data = await api("/api/tasks/" + encodeURIComponent(id));
      const t = data.task;
      state.currentStatus = t.status || "";
      document.getElementById("taskTitle").textContent = t.title + (t.project_id ? (" · " + t.project_id) : "");
      document.getElementById("modeSelect").value = t.mode || "craft";
      document.getElementById("modeChip").textContent = MODE_LABEL[t.mode] || t.mode || "创作";
      if (t.project_id && t.project_id !== state.projectId) {
        // Keep filter unless user is browsing all; soft-sync chip only when empty
        if (!state.projectId) setProjectId(t.project_id);
      }
      renderMessages(t.messages || []);
      await refreshWorkspace(id);
      await refreshTasks();
      if (t.status === "running") startPoll();
      else stopPoll();
    }

    function renderMessages(msgs, pending) {
      const box = document.getElementById("messages");
      if (!msgs.length && !pending) {
        box.innerHTML = `<div class="empty"><div class="empty-art"></div>发送第一条消息开始
          <div class="cta"><button type="button" class="btn" id="btnEmptyFocus">开始输入</button></div></div>`;
        const b = document.getElementById("btnEmptyFocus");
        if (b) b.addEventListener("click", () => document.getElementById("composer").focus());
        return;
      }
      let html = msgs.map(m => `
        <div class="bubble ${escapeHtml(m.role)}">
          <div class="role">${ROLE_LABEL[m.role] || m.role}</div>
          <div>${escapeHtml(humanizeContent(m.content))}</div>
          <div class="meta">${formatTs(m.ts)}</div>
        </div>`).join("");
      if (pending) {
        html += `<div class="bubble assistant pending"><div class="role">助手</div><div>正在处理…</div></div>`;
      }
      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    async function refreshWorkspace(id) {
      const ws = await api("/api/tasks/" + encodeURIComponent(id) + "/workspace");
      const empty = (t) => `<div class="empty"><div class="empty-art"></div>${t}</div>`;
      document.getElementById("pane-artifacts").innerHTML = (ws.artifacts || []).map(a =>
        `<div class="art-row"><span>${escapeHtml(a.path)}</span><span>${a.bytes || 0} B</span></div>`
      ).join("") || empty("暂无产物");
      document.getElementById("pane-files").innerHTML = (ws.files || []).filter(f => f.path !== "task.json").map(f =>
        `<div class="file-row" data-path="${escapeHtml(f.path)}">
          <span>${escapeHtml(f.path)}</span>
          <span class="actions">
            <span>${f.bytes} B</span>
            <button type="button" data-dl="${escapeHtml(f.path)}">下载</button>
          </span>
        </div>`
      ).join("") || empty("暂无文件");
      document.getElementById("pane-changes").innerHTML = (ws.changes || []).map(c =>
        `<div class="art-row"><span>${escapeHtml(c.kind || "change")}</span><span>${escapeHtml(c.path || c.status || "")}</span></div>`
      ).join("") || empty("暂无变更");
      if (ws.preview) renderPreview(ws.preview);
    }

    function mdLite(src) {
      let s = escapeHtml(src);
      s = s.replace(/^### (.*)$/gm, "<h3>$1</h3>");
      s = s.replace(/^## (.*)$/gm, "<h2>$1</h2>");
      s = s.replace(/^# (.*)$/gm, "<h1>$1</h1>");
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\n\n/g, "</p><p>");
      return "<p>" + s + "</p>";
    }
    function renderPreview(prev) {
      const host = document.getElementById("previewHost");
      if (!prev || !prev.ok) {
        host.innerHTML = '<div class="empty"><div class="empty-art"></div>' +
          escapeHtml((prev && (prev.error || prev.content)) || "选择文件查看预览") + "</div>";
        return;
      }
      const fmt = prev.format || "text";
      if (fmt === "html") {
        host.innerHTML = '<iframe sandbox="allow-same-origin" style="width:100%;height:55vh;border:1px solid var(--line);border-radius:8px;background:#fff" srcdoc=""></iframe>';
        host.querySelector("iframe").srcdoc = prev.content || "";
      } else if (fmt === "markdown") {
        host.innerHTML = '<div class="preview" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0.75rem">' + mdLite(prev.content || "") + "</div>";
      } else if (fmt === "image") {
        host.innerHTML = '<img alt="preview" style="max-width:100%;border-radius:8px;border:1px solid var(--line)" src="' + escapeHtml(prev.content || "") + '" />';
      } else {
        host.innerHTML = '<pre class="preview"></pre>';
        host.querySelector("pre").textContent = prev.content || "";
      }
    }

    document.getElementById("pane-files").addEventListener("click", async (e) => {
      const dl = e.target.closest("[data-dl]");
      if (dl && state.current) {
        e.stopPropagation();
        const url = "/api/tasks/" + encodeURIComponent(state.current) +
          "/download?path=" + encodeURIComponent(dl.dataset.dl) + "&raw=1";
        try {
          const r = await fetch(url, { headers: headers() });
          if (!r.ok) throw new Error("下载失败");
          const blob = await r.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = dl.dataset.dl.split("/").pop() || "download";
          a.click();
          URL.revokeObjectURL(a.href);
          toast("已开始下载", "ok");
        } catch (err) {
          toast(err.message || "下载失败", "error");
        }
        return;
      }
      const row = e.target.closest(".file-row");
      if (!row || !state.current) return;
      const data = await api("/api/tasks/" + encodeURIComponent(state.current) +
        "/preview?path=" + encodeURIComponent(row.dataset.path));
      renderPreview(data);
      document.querySelectorAll("#resultTabs button").forEach(b => b.classList.toggle("active", b.dataset.pane === "preview"));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === "pane-preview"));
    });

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (!state.current) {
        const body = { title: file.name, mode: document.getElementById("modeSelect").value };
        if (state.projectId) body.project_id = state.projectId;
        const created = await api("/api/tasks", {
          method: "POST",
          body: JSON.stringify(body),
        });
        state.current = created.task.task_id;
      }
      const hint = document.getElementById("uploadHint");
      hint.textContent = "上传中…";
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const b64 = btoa(binary);
      try {
        const data = await api("/api/tasks/" + encodeURIComponent(state.current) + "/upload", {
          method: "POST",
          body: JSON.stringify({ filename: file.name, content_base64: b64 }),
        });
        hint.textContent = "已上传 " + (data.upload && data.upload.path);
        renderMessages(data.task.messages || []);
        await refreshWorkspace(state.current);
        await refreshTasks();
        toast("附件已上传", "ok");
      } catch (err) {
        hint.textContent = "失败: " + err.message;
        toast("上传失败：" + err.message, "error");
      }
    });

    async function refreshEnterprise() {
      try {
        const ent = await api("/api/enterprise");
        const c = ent.casdoor || {};
        const m = ent.milvus || {};
        const chip = document.getElementById("entChip");
        const cOk = c.configured ? (c.reachable === false ? "SSO 未连通" : "SSO 正常") : "SSO 未配";
        const mOk = m.configured ? (m.reachable === false ? "向量未连通" : "向量正常") : "向量未配";
        chip.textContent = cOk + " · " + mOk;
        chip.className = "chip " + ((c.reachable === false || m.reachable === false) ? "warn" : (c.configured || m.configured ? "ok" : "muted"));
        chip.title = JSON.stringify({ casdoor: c, milvus: m });
      } catch {
        document.getElementById("entChip").textContent = "企业服务 · —";
      }
    }

    document.getElementById("btnHarbor").addEventListener("click", async () => {
      toast("Harbor 演练中…");
      try {
        const data = await api("/api/harbor/dry-run", { method: "POST", body: JSON.stringify({ timeout: 60 }) });
        toast(data.ok ? "Harbor 演练成功" : ("Harbor：" + (data.error || "失败")), data.ok ? "ok" : "error");
      } catch (err) {
        toast("Harbor：" + err.message, "error");
      }
    });
    document.getElementById("btnScore").addEventListener("click", async () => {
      const live = confirm("确定跑 live 评分？\n取消 = 仅演练（推荐）\n确定 = live（耗时长）");
      toast(live ? "Live 评分中…" : "演练评分中…");
      try {
        const data = await api("/api/harbor/score", {
          method: "POST",
          body: JSON.stringify({ live: !!live, timeout: live ? 180 : 30 }),
        });
        toast(data.ok === false ? ("评分失败") : "评分完成", data.ok === false ? "error" : "ok");
      } catch (err) {
        toast("评分：" + err.message, "error");
      }
    });

    document.getElementById("resultTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-pane]");
      if (!btn) return;
      document.querySelectorAll("#resultTabs button").forEach(b => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === "pane-" + btn.dataset.pane));
    });

    async function createTaskPrompt() {
      const title = prompt("任务标题", "新任务");
      if (!title) return;
      const mode = document.getElementById("modeSelect").value;
      const body = { title, mode };
      if (state.projectId) body.project_id = state.projectId;
      const data = await api("/api/tasks", { method: "POST", body: JSON.stringify(body) });
      await refreshTasks();
      await openTask(data.task.task_id);
    }
    document.getElementById("btnNew").addEventListener("click", createTaskPrompt);
    document.getElementById("btnEmptyNew").addEventListener("click", createTaskPrompt);

    document.getElementById("btnSend").addEventListener("click", sendMessage);
    document.getElementById("composer").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function startPoll() {
      stopPoll();
      state.pollTimer = setInterval(async () => {
        if (!state.current || state.sending) return;
        try {
          const data = await api("/api/tasks/" + encodeURIComponent(state.current));
          const t = data.task;
          if (t.status !== state.currentStatus) {
            state.currentStatus = t.status;
            renderMessages(t.messages || []);
            await refreshWorkspace(state.current);
            await refreshTasks();
          } else {
            renderMessages(t.messages || []);
          }
          if (t.status !== "running") stopPoll();
        } catch { /* ignore poll errors */ }
      }, 2000);
    }
    function stopPoll() {
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    }

    async function sendMessage() {
      if (state.sending) return;
      const dry = document.getElementById("dryRun").checked;
      if (!dry && !state.liveConfirmShown) {
        toast("将真实执行任务（未勾选「仅演练」）");
        state.liveConfirmShown = true;
      }
      if (!state.current) {
        const title = document.getElementById("composer").value.trim().slice(0, 40) || "新任务";
        const body = { title, mode: document.getElementById("modeSelect").value };
        if (state.projectId) body.project_id = state.projectId;
        const created = await api("/api/tasks", {
          method: "POST",
          body: JSON.stringify(body),
        });
        state.current = created.task.task_id;
      }
      const content = document.getElementById("composer").value.trim();
      if (!content) return;
      state.sending = true;
      const btn = document.getElementById("btnSend");
      btn.disabled = true;
      btn.textContent = "处理中…";
      const optimistic = [
        ...(state.tasks.find(t => t.task_id === state.current) ? [] : []),
      ];
      // show pending bubble with current messages + user text
      try {
        const cur = await api("/api/tasks/" + encodeURIComponent(state.current));
        const msgs = (cur.task.messages || []).concat([{ role: "user", content, ts: new Date().toISOString() }]);
        renderMessages(msgs, true);
      } catch {
        renderMessages([{ role: "user", content, ts: new Date().toISOString() }], true);
      }
      try {
        const data = await api("/api/tasks/" + encodeURIComponent(state.current) + "/messages", {
          method: "POST",
          body: JSON.stringify({ content, run: true, dry, stream: !dry }),
        });
        document.getElementById("composer").value = "";
        state.currentStatus = data.task.status || "";
        renderMessages(data.task.messages || [], !!data.streaming);
        if (data.streaming && window.wbParity && typeof window.wbParity.consumeEvents === "function") {
          stopPoll();
          try {
            await window.wbParity.consumeEvents(state.current);
          } catch (sseErr) {
            toast("进度流中断，改为轮询：" + (sseErr.message || ""), "error");
            startPoll();
          }
        } else {
          await refreshWorkspace(state.current);
          await refreshTasks();
          if (data.task.status === "running") startPoll();
          else stopPoll();
        }
      } catch (err) {
        toast("发送失败：" + err.message, "error");
      } finally {
        state.sending = false;
        btn.disabled = false;
        btn.textContent = "发送";
      }
    }

    document.getElementById("modeSelect").addEventListener("change", async () => {
      if (!state.current) return;
      const mode = document.getElementById("modeSelect").value;
      await api("/api/tasks/" + encodeURIComponent(state.current) + "/patch", {
        method: "POST", body: JSON.stringify({ mode }),
      });
      document.getElementById("modeChip").textContent = MODE_LABEL[mode] || mode;
      refreshTasks();
    });
    document.getElementById("btnPin").addEventListener("click", async () => {
      if (!state.current) return;
      const cur = state.tasks.find(t => t.task_id === state.current);
      await api("/api/tasks/" + encodeURIComponent(state.current) + "/patch", {
        method: "POST", body: JSON.stringify({ pinned: !(cur && cur.pinned) }),
      });
      refreshTasks();
    });
    document.getElementById("btnRename").addEventListener("click", () => {
      if (state.current) renameTask(state.current);
    });
    document.getElementById("btnArchive").addEventListener("click", async () => {
      if (!state.current) return;
      await api("/api/tasks/" + encodeURIComponent(state.current) + "/patch", {
        method: "POST", body: JSON.stringify({ archived: true }),
      });
      clearCurrent("任务已归档");
      refreshTasks();
    });
    document.getElementById("btnDelete").addEventListener("click", () => {
      if (state.current) deleteTask(state.current);
    });

    document.getElementById("btnSkills").addEventListener("click", async () => {
      document.getElementById("skillsDrawer").classList.add("open");
      document.getElementById("projectDrawer").classList.remove("open");
      const pd = document.getElementById("parityDrawer");
      if (pd) pd.classList.remove("open");
      const data = await api("/api/skills");
      const installed = new Set(data.installed || []);
      const canDeposit = !!state.projectId;
      document.getElementById("skillsList").innerHTML = (canDeposit
        ? `<p style="color:var(--muted);font-size:0.8rem;margin:0 0 0.75rem">当前项目：<strong>${escapeHtml(state.projectId)}</strong> — 可「存入项目」</p>`
        : `<p style="color:var(--muted);font-size:0.8rem;margin:0 0 0.75rem">未选项目时仅可安装到本机；选中项目后可存入项目空间。</p>`) +
        (data.skills || []).map(s => `
        <div class="skill-row">
          <h3>${escapeHtml(s.name || s.id)}</h3>
          <p>${escapeHtml(s.description || "")}</p>
          <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
            <button type="button" class="btn ${installed.has(s.id) ? "ghost" : ""}" data-install="${escapeHtml(s.id)}" ${installed.has(s.id) ? "disabled" : ""}>
              ${installed.has(s.id) ? "已安装" : "安装"}
            </button>
            <button type="button" class="btn ghost" data-deposit="${escapeHtml(s.id)}" ${canDeposit ? "" : "disabled"} title="${canDeposit ? "存入当前项目空间" : "请先选择项目"}">
              存入项目
            </button>
          </div>
        </div>`).join("") || '<div class="empty">无技能</div>';
    });
    document.getElementById("btnCloseSkills").addEventListener("click", () => {
      document.getElementById("skillsDrawer").classList.remove("open");
    });
    document.getElementById("skillsList").addEventListener("click", async (e) => {
      const dep = e.target.closest("[data-deposit]");
      if (dep && !dep.disabled) {
        if (!state.projectId) { toast("请先选择项目空间", "error"); return; }
        dep.disabled = true; dep.textContent = "存入中…";
        try {
          await api("/api/projects/" + encodeURIComponent(state.projectId) + "/skills/deposit", {
            method: "POST",
            body: JSON.stringify({ skill_id: dep.dataset.deposit }),
          });
          dep.textContent = "已存入";
          toast("技能已存入项目", "ok");
          await refreshProjects();
        } catch {
          dep.disabled = false; dep.textContent = "存入项目";
        }
        return;
      }
      const btn = e.target.closest("[data-install]");
      if (!btn || btn.disabled) return;
      btn.disabled = true; btn.textContent = "安装中…";
      try {
        await api("/api/skills/install", { method: "POST", body: JSON.stringify({ skill_id: btn.dataset.install }) });
        btn.textContent = "已安装";
        toast("技能已安装", "ok");
      } catch (err) {
        btn.disabled = false; btn.textContent = "安装失败";
      }
    });

    async function boot() {
      if (!(await ensureAuth())) return;
      await refreshEnterprise();
      await refreshProjects();
      await refreshTasks();
      if (state.tasks[0]) await openTask(state.tasks[0].task_id);
    }
    boot();
  </script>
</body>
</html>
